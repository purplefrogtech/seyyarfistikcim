<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seyyar Fıstıkçım</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="navbar-container">
          <div class="logo">

            <img class="logo-img" src="../images/logo.png" alt="">
            <h1 class="title">Seyyar Fıstıkçım</h1>
            
          </div>
          <nav class="nav-links">
            <a href="#anasayfa">Anasayfa</a>
            <a href="#iletisim">İletişim</a>
            <button class="button">
              <a href="#giris">Giriş Yap / Kayıt Ol</a>
            </button>
            
          </nav>
        </div>
      </header>
      
      <section class="slider">
        <div class="slider-container">
          <img class="slide active" src="../images/slider.jpg" alt="Slider 1">
          <img class="slide" src="../images/slider2.jpg" alt="Slider 2">
          <img class="slide" src="../images/slider3.jpg" alt="Slider 3">
          <img class="slide" src="../images/slider4.jpg" alt="Slider 4">
          <img class="slide" src="../images/slider5.jpg" alt="Slider 5">
          <img class="slide" src="../images/slider6.jpg" alt="Slider 6">
          <img class="slide" src="../images/slider7.jpg" alt="Slider 7">
          <img class="slide" src="../images/slider8.jpg" alt="Slider 8">
          <img class="slide" src="../images/slider9.jpg" alt="Slider 9">
        </div>
      </section>
      

  <main class="container">
    <h1>Seyyar Fıstıkçım</h1>
    <p>İnsanlar birbirine yer fıstığı ikram ediyor. Gerçekten.</p>

    <!-- BARDKLAR -->
    <section class="bardaklar">
        <div class="bardak-kutu" data-fiyat="30">
          <img src="../images/bardak30.png" alt="Küçük Bardak">
          <span class="boyut">Küçük</span>
        </div>
        <div class="bardak-kutu" data-fiyat="40">
          <img src="../images/bardak40.png" alt="Orta Bardak">
          <span class="boyut">Orta</span>
        </div>
        <div class="bardak-kutu" data-fiyat="50">
          <img src="../images/bardak50.png" alt="Büyük Bardak">
          <span class="boyut">Büyük</span>
        </div>
      </section>
      
      
      
      
      




  </main>

  <script src="app.js"></script>
</body>
</html>
